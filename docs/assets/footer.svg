    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4178DC" stop-opacity="0"/><stop offset="0.5" stop-color="#8fb4ff"/><stop offset="1" stop-color="#4178DC" stop-opacity="0"/></linearGradient>
