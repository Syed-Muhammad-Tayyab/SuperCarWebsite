<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190222"/><stop offset="0.55" stop-color="#0d0a2e"/><stop offset="1" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4178DC" stop-opacity="0"/><stop offset="0.5" stop-color="#4178DC"/><stop offset="1" stop-color="#4178DC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="120" fill="#4178DC" opacity="0.35" filter="url(#blur)"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="140" cy="280" r="100" fill="#9b2fd6" opacity="0.30" filter="url(#blur)"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="6s" repeatCount="indefinite"/></circle>
  <!-- speed lines -->
  <g stroke="url(#glow)" stroke-width="2" stroke-linecap="round">
    <line x1="-300" y1="60" x2="0" y2="60"><animate attributeName="x1" from="-300" to="1200" dur="2.2s" repeatCount="indefinite"/><animate attributeName="x2" from="0" to="1500" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="-300" y1="110" x2="-60" y2="110"><animate attributeName="x1" from="-300" to="1200" dur="3.1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="x2" from="-60" to="1440" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></line>
    <line x1="-300" y1="250" x2="-20" y2="250"><animate attributeName="x1" from="-300" to="1200" dur="2.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="x2" from="-20" to="1480" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></line>
    <line x1="-300" y1="290" x2="-100" y2="290"><animate attributeName="x1" from="-300" to="1200" dur="3.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="x2" from="-100" to="1400" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="64" text-anchor="middle" font-family="Exo, 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="8" fill="#8fb4ff">RESPONSIVE &#183; ANIMATED &#183; MOBILE-FIRST</text>
  <text x="600" y="150" text-anchor="middle" font-family="Exo, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#txt)">SuperCarWebsite
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/></text>
  <text x="600" y="196" text-anchor="middle" font-family="Exo, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#BABEC4">Pick your best car &#8212; a next-generation showcase with video slider, Swiper &amp; MixItUp</text>
  <rect x="380" y="226" width="440" height="42" rx="21" fill="#4178DC" fill-opacity="0.18" stroke="#4178DC" stroke-opacity="0.7"/>
  <text x="600" y="254" text-anchor="middle" font-family="Exo, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Developed by Syed Muhammad Tayyab
    <animate attributeName="fill" values="#ffffff;#8fb4ff;#ffffff" dur="4s" repeatCount="indefinite"/></text>
</svg>
